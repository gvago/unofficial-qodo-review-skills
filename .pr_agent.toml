[review_agent]
enable_skills_agent = false
enable_skill_steering = true
enable_cross_repo_skill_steering = true
enable_review_md = true
enable_cross_repo_agent = true

[github_app]
ignore_bot_pr = false


[review_agent_ux]
display_mode = "default"
findings_group_by = "action_level"
finding_overflow_count = 0
resolved_overflow_count = 0
link_findings_to_inline_comments = false
render_description = true
render_code = true
render_evidence = true
render_recommendation = true
render_prompt = true
expand_description = false
expand_code = false
expand_evidence = false
expand_recommendation = false
expand_prompt = false

[review_agent_ux.findings_overflow]
action_required = 0
remediation_recommended = 0
informational = 0


[chat_agent.cross_repo_repos]
"gvago/unofficial-qodo-review-skills" = [{repo = "gvago/qodo-rules-starter", provider = "github", relation = "Coordinated client configuration and service contract examples. Select linked companion PR refs from the reviewed PR description before checking handlers and configuration consumers."}]
